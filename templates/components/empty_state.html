{% load i18n core_extras %}
<div class="text-center text-body-secondary py-5 px-3">
    <p class="mb-3">{{ empty_message|default:_("Nothing here yet.") }}</p>
    {% if can_create and create_url_name %}
        {% url_or_blank create_url_name as create_url %}
        {% if create_url %}
            <a class="btn btn-sm btn-primary" href="{{ create_url }}">{% translate "Add the first one" %}</a>
        {% endif %}
    {% endif %}
</div>
