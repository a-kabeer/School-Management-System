{% extends "base.html" %}
{% load i18n %}

{% block content %}
<div class="card border-danger">
    <div class="card-body">
        <p class="lead">
            {% blocktranslate with name=object %}Delete “{{ name }}”? This can be restored later by an administrator.{% endblocktranslate %}
        </p>
        <form method="post">
            {% csrf_token %}
            <div class="d-flex flex-wrap gap-2">
                <button type="submit" class="btn btn-danger">{% translate "Delete" %}</button>
                <a href="{{ request.META.HTTP_REFERER|default:'..' }}"
                   class="btn btn-outline-secondary">{% translate "Cancel" %}</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
