{% extends "base.html" %}
{% load i18n %}

{% block content %}
<div class="card card-body mb-3">
    <p class="text-body-secondary">{% translate "Only unsettled invoices from your current branch are listed." %}</p>
    <form method="post" novalidate>
        {% csrf_token %}
        {% include "components/form.html" %}
        <div class="d-flex flex-wrap gap-2 mt-3">
            <button type="submit" class="btn btn-primary">{% translate "Record payment" %}</button>
            <a href="{% url 'fees:invoice_list' %}" class="btn btn-outline-secondary">{% translate "Cancel" %}</a>
        </div>
    </form>
</div>
{% endblock %}
